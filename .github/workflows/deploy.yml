name: Build and deploy ClefGlide
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/0flush0/sightflow:${{ github.sha }}

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'sightflow-production' || format('clefglide-checks-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  publish:
    needs: check
    if: >-
      github.repository == '0Flush0/clefglide' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify the production ref
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    # Activate after configuring the environment and secrets in docs/HOSTING.md.
    # environment: production
    steps:
      - name: Deploy over SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            printf 'DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
            cat <<'REMOTE'
          set -euo pipefail
          if ! cd -- "${DEPLOY_PATH:-$HOME/hosting/apps/sightflow}" 2>/dev/null; then
            echo 'Cannot enter the deployment directory. Check DEPLOY_PATH and the SSH user.' >&2
            exit 1
          fi
          printf 'SIGHTFLOW_IMAGE=%s\n' "$SIGHTFLOW_IMAGE" > .env
          docker compose pull
          docker compose up -d --remove-orphans
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "SIGHTFLOW_IMAGE='$IMAGE' bash -s"
